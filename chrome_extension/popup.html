<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
    }

    h2 {
      margin-top: 0;
      color: #6a11cb;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 500;
      color: #666;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      text-align: center;
      color: #28a745;
      display: none;
    }
  </style>
</head>

<body>
  <h2>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 4H20L14 14V20L10 22V14L4 4Z" stroke="#6a11cb" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
    Distill Configuration
  </h2>

  <div class="form-group">
    <label for="backendUrl">Backend URL</label>
    <input type="text" id="backendUrl" placeholder="http://localhost:8000">
  </div>

  <div class="form-group">
    <label for="compressionRate">Compression Rate (0.1 - 0.9)</label>
    <input type="number" id="compressionRate" placeholder="0.5" step="0.1" min="0.1" max="0.9">
  </div>

  <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
    <input type="checkbox" id="autoCompress" style="width: auto;">
    <label for="autoCompress" style="margin-bottom: 0;">Auto-Compress (on Enter)</label>
  </div>

  <button id="save">Save Settings</button>
  <div id="status" class="status">Saved!</div>

  <script src="popup.js"></script>
</body>

</html>
